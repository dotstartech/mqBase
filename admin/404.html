<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - mqBase</title>
    <style>
        /* Catppuccin Mocha Color Palette */
        :root {
            --ctp-base: #1e1e2e;
            --ctp-mantle: #181825;
            --ctp-surface0: #313244;
            --ctp-surface1: #45475a;
            --ctp-text: #cdd6f4;
            --ctp-subtext1: #bac2de;
            --ctp-subtext0: #a6adc8;
            --ctp-overlay0: #6c7086;
            --ctp-mauve: #cba6f7;
            --ctp-red: #f38ba8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--ctp-base);
            color: var(--ctp-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 32px;
        }

        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: var(--ctp-mauve);
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--ctp-text);
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: var(--ctp-subtext0);
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .home-link {
            display: inline-block;
            padding: 12px 28px;
            background-color: var(--ctp-mauve);
            color: var(--ctp-base);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 6px;
            transition: opacity 0.2s ease;
        }

        .home-link:hover {
            opacity: 0.9;
        }

        .footer {
            position: absolute;
            bottom: 24px;
            font-size: 12px;
            color: var(--ctp-overlay0);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/admin/logo-mid.png" alt="mqBase" class="logo">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="home-link">Go to Dashboard</a>
    </div>
    <div class="footer">
        © 2026 mqBase
    </div>
</body>
</html>
